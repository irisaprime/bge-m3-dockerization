# =============================================================================
# Kubernetes Network Policy for BGE-M3 Embedding Service
# =============================================================================
# Zero-trust network policy restricting ingress and egress traffic
# Apply with: kubectl apply -f network-policy.yaml
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bge-m3-embedding-netpol
  namespace: default  # Change to your namespace
  labels:
    app: bge-m3-embedding
    security: hardened
spec:
  podSelector:
    matchLabels:
      app: bge-m3-embedding

  # Policy types
  policyTypes:
    - Ingress
    - Egress

  # ==========================================================================
  # Ingress Rules - Who can connect to the service
  # ==========================================================================
  ingress:
    # Allow traffic from API gateway/load balancer
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx  # Adjust based on your ingress controller
      - podSelector:
          matchLabels:
            app: api-gateway  # Adjust based on your setup
      ports:
        - protocol: TCP
          port: 8000  # Application port

    # Allow traffic from monitoring/observability
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      - podSelector:
          matchLabels:
            app: prometheus
      ports:
        - protocol: TCP
          port: 8000  # Metrics endpoint

  # ==========================================================================
  # Egress Rules - What the service can connect to
  # ==========================================================================
  egress:
    # Allow DNS resolution (required for service discovery)
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      - podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

    # Block all other egress by default (air-gapped)
    # Uncomment if you need to allow specific egress
    # - to:
    #   - podSelector:
    #       matchLabels:
    #         app: some-service
    #   ports:
    #     - protocol: TCP
    #       port: 443

---
# =============================================================================
# PodSecurityPolicy for BGE-M3 (Deprecated in K8s 1.25+, use Pod Security Standards)
# =============================================================================
# Note: PodSecurityPolicy is deprecated. Use Pod Security Admission instead.
# This is provided for reference for older clusters.

apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: bge-m3-embedding-psp
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default,bge-m3-embedding'
spec:
  # Run as non-root
  runAsUser:
    rule: MustRunAsNonRoot

  # Use specific user/group
  runAsGroup:
    rule: MustRunAs
    ranges:
      - min: 65532
        max: 65532

  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 65532
        max: 65532

  supplementalGroups:
    rule: RunAsAny

  # Read-only root filesystem
  readOnlyRootFilesystem: true

  # Allowed volumes
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'

  # No privilege escalation
  allowPrivilegeEscalation: false

  # Drop all capabilities
  requiredDropCapabilities:
    - ALL

  # No privileged containers
  privileged: false

  # No host access
  hostNetwork: false
  hostPID: false
  hostIPC: false
  hostPorts: []

  # SELinux
  seLinux:
    rule: RunAsAny

---
# =============================================================================
# Pod Security Standards (K8s 1.25+) - Recommended
# =============================================================================
# Apply at namespace level with labels:
# kubectl label namespace default pod-security.kubernetes.io/enforce=restricted

apiVersion: v1
kind: Namespace
metadata:
  name: bge-m3-secure
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# =============================================================================
# Example Deployment with Security Hardening
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-m3-embedding
  namespace: bge-m3-secure
  labels:
    app: bge-m3-embedding
    version: v1.0.0
    security: hardened
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bge-m3-embedding
  template:
    metadata:
      labels:
        app: bge-m3-embedding
      annotations:
        # Security annotations
        container.apparmor.security.beta.kubernetes.io/bge-m3: runtime/default
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      # =======================================================================
      # Security Context (Pod Level)
      # =======================================================================
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # Service account (minimal permissions)
      serviceAccountName: bge-m3-embedding-sa
      automountServiceAccountToken: false

      # =======================================================================
      # Container Specification
      # =======================================================================
      containers:
      - name: bge-m3-embedding
        image: bge-m3-secure:latest
        imagePullPolicy: Always

        # =====================================================================
        # Security Context (Container Level)
        # =====================================================================
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
              - ALL

        # =====================================================================
        # Resources
        # =====================================================================
        resources:
          limits:
            cpu: "4000m"
            memory: "8Gi"
          requests:
            cpu: "2000m"
            memory: "4Gi"

        # =====================================================================
        # Ports
        # =====================================================================
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        # =====================================================================
        # Environment Variables
        # =====================================================================
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: bge-m3-api-key
              key: api-key
        - name: API_KEY_ENABLED
          value: "true"
        - name: USE_ONNX
          value: "true"

        # =====================================================================
        # Volume Mounts
        # =====================================================================
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
        # - name: models
        #   mountPath: /models
        #   readOnly: true

        # =====================================================================
        # Probes
        # =====================================================================
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30

      # =======================================================================
      # Volumes
      # =======================================================================
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: var-tmp
        emptyDir:
          sizeLimit: 512Mi
      # - name: models
      #   persistentVolumeClaim:
      #     claimName: bge-m3-models-pvc

      # =======================================================================
      # Node Selection (optional)
      # =======================================================================
      # nodeSelector:
      #   workload: cpu-intensive

      # Tolerations for tainted nodes
      # tolerations:
      # - key: "workload"
      #   operator: "Equal"
      #   value: "ml"
      #   effect: "NoSchedule"

      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bge-m3-embedding
              topologyKey: kubernetes.io/hostname

---
# =============================================================================
# Service Account with Minimal Permissions
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: bge-m3-embedding-sa
  namespace: bge-m3-secure
automountServiceAccountToken: false

---
# =============================================================================
# Service Exposure
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: bge-m3-embedding-service
  namespace: bge-m3-secure
  labels:
    app: bge-m3-embedding
spec:
  type: ClusterIP  # Use LoadBalancer or NodePort if needed
  selector:
    app: bge-m3-embedding
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# Secret for API Key
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: bge-m3-api-key
  namespace: bge-m3-secure
type: Opaque
stringData:
  api-key: "CHANGE_ME_IN_PRODUCTION"  # Generate with: openssl rand -base64 32

---
# =============================================================================
# Usage Instructions
# =============================================================================

# Apply all resources:
#   kubectl apply -f network-policy.yaml

# Verify network policy:
#   kubectl describe networkpolicy bge-m3-embedding-netpol

# Test connectivity:
#   kubectl run -it --rm debug --image=alpine --restart=Never -- sh
#   # Inside pod: wget -O- http://bge-m3-embedding-service/health

# View logs:
#   kubectl logs -l app=bge-m3-embedding --tail=100 -f

# Scale deployment:
#   kubectl scale deployment bge-m3-embedding --replicas=5

# =============================================================================
